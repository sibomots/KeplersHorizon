<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Kepler's Horizon Console</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/kh/">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link href="kh.css" rel="stylesheet">
</head>

<body>
  <div class="app">
    <header>
      <div class="title">Kepler's Horizon</div>
      <div class="right">
        <span id="loginBadge" class="pill">loading...</span>
        <button id="btnMap">Show Map</button>
        <button id="btnLobby">Exit to Lobby</button>
      </div>
    </header>

    <div class="main">
      <section class="panel">
        <h2>
          <span id="consoleTitle">Main Console</span>
          <span id="turnStatus" style="padding:2px 10px; border-radius:6px; font-size:12px;">--</span>
        </h2>

        <div class="viewport">
          <div id="consoleLog"></div>

          <div id="mapView">
            <iframe id="mapFrame" src="map_view.html" title="Kepler's Horizon Map"></iframe>
          </div>
        </div>

        <div class="inputRow">
          <input id="commandInput" style="text-transform: uppercase;" type="text" placeholder="ENTER COMMAND..."
            autocomplete="off" spellcheck="false">
        </div>
        <div style="padding:2px 12px 8px; text-align:center;">
          <a href="https://github.com/sibomots/KeplersHorizon/wiki/How-to-Play" target="_blank"
            style="color:var(--muted); font-size:20px; text-decoration:none;">How to Play</a>
        </div>
      </section>

      <section class="panel">
        <h2>
          <span>Telemetry</span>
          <span id="peerOnlineStatus" style="padding:2px 10px; border-radius:6px; font-size:20px;">--</span>
        </h2>
        <div class="statusBody">
          <div class="kv">
            <div class="k" style="display:none;">GameId</div>
            <div class="v" id="stGameId" style="display:none;">-</div>
            <div class="k">Round</div>
            <div class="v" id="stRound">-</div>
            <div class="k">Phase</div>
            <div class="v" id="stPhase">-</div>
            <div class="k">VP</div>
            <div class="v" id="stVP">-</div>
            <div class="k">BP</div>
            <div class="v" id="stBP">-</div>
          </div>

          <div id="statusCombat" class="kv"
            style="display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">
            <div class="k" style="color:var(--bad);">COMBAT</div>
            <div class="v" id="stCmbCount" style="color:var(--bad); font-weight:bold;">-</div>
            <div class="k">Hexes</div>
            <div class="v" id="stCmbHexes">-</div>
          </div>
        </div>
        <div id="sensorStatus"
          style="padding:8px 12px; border-top:1px solid var(--border); font-size:18px; font-weight:700; text-align:center;">
          <!-- Content populated by behavior.js -->
        </div>
        <div style="padding:10px 12px;border-top:1px solid var(--border);color:var(--muted);font-size:18px;">
          TBD - Status for Combat Area - TBD
        </div>
      </section>
    </div>
  </div>

  <script src="constraints.js?v=3"></script>
  <script src="slate.js?v=3"></script>
  <script src="behavior.js?v=3"></script>
  <script src="interface.js?v=3"></script>
</body>

</html>
