<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepler's Horizon - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --panel: #0a0a12;
            --text: #3f3;
            --muted: #2a2;
            --accent: #4f4;
            --border: #1a3a1a;
            --good: #4f8;
            --bad: #f44;
            --glow: rgba(50, 255, 50, 0.8);
            --glow-soft: rgba(50, 255, 50, 0.4);
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Fira Code", monospace;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;


            text-transform: uppercase;
            text-shadow: 0 0 5px var(--glow), 0 0 15px var(--glow-soft);
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 0 20px rgba(50, 255, 50, 0.2);
        }

        .card-header {
            background: transparent;
            border-bottom: 1px solid var(--border);
            text-align: center;
            padding: 1.5rem;
        }

        .card-header h1 {
            font-size: 2rem;
            margin: 0;
            color: var(--text);
            text-shadow: 0 0 10px var(--glow);
        }

        .card-header .subtitle {
            color: var(--muted);
            font-size: 1.2rem;
            margin-top: 0.5rem;
        }

        .form-control {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: "Fira Code", monospace;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
            font-size: 1.3rem;
            text-shadow: 0 0 5px var(--glow);
        }

        .form-control:focus {
            background: var(--bg);
            border-color: var(--accent);
            color: var(--text);
            box-shadow: 0 0 8px var(--glow-soft);
        }

        .form-control::placeholder {
            color: var(--muted);
            text-shadow: none;
        }

        .btn-primary {
            background: transparent;
            border: 1px solid var(--text);
            color: var(--text);
            font-family: "Fira Code", monospace;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
            font-size: 1.3rem;
            text-shadow: 0 0 5px var(--glow);
        }

        .btn-primary:hover {
            background: var(--text);
            color: var(--bg);
            box-shadow: 0 0 15px var(--glow);
        }

        .alert {
            font-size: 1.1rem;
            background: rgba(255, 68, 68, 0.2);
            border-color: var(--bad);
            color: var(--bad);
        }

        .alert-success {
            background: rgba(68, 255, 136, 0.2);
            border-color: var(--good);
            color: var(--good);
        }

        .form-label {
            color: var(--muted);
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-header">
            <h1>Kepler's Horizon</h1>
            <div class="subtitle">Space Fleet Tactics</div>
        </div>

        <div class="card-body p-4">
            <div id="alertBox" class="alert d-none" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="loginUsername" class="form-label">Username</label>
                    <input type="text" class="form-control" id="loginUsername" required autocomplete="username">
                </div>
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="loginPassword" required
                        autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <hr style="border-color: var(--border); margin: 1.5rem 0;">

            <button type="button" class="btn btn-primary w-100" id="btnBridgeCheck"
                style="font-size: 1rem; padding: 0.6rem;">
                Check Settings on the Command Bridge
            </button>
            <div id="bridgeStatus" style="text-align: center; margin-top: 0.75rem; font-size: 0.9rem;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="portal.js"></script>
</body>

</html>
