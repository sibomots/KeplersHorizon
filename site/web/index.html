<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepler's Horizon - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #3b82f6;
            --good: #6ee7b7;
            --bad: #fb7185;
            --muted: #94a3b8;
            --text: #f1f5f9;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .card {
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            max-width: 400px;
            width: 100%;
        }

        .card-header {
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            padding: 1.5rem;
        }

        .card-header h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--accent);
        }

        .card-header .subtitle {
            color: var(--muted);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .nav-tabs {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-tabs .nav-link {
            color: var(--muted);
            border: none;
            border-bottom: 2px solid transparent;
            border-radius: 0;
        }

        .nav-tabs .nav-link.active {
            background: transparent;
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .nav-tabs .nav-link:hover {
            color: var(--text);
            border-color: transparent;
            border-bottom-color: var(--muted);
        }

        .form-control {
            background: var(--bg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text);
        }

        .form-control:focus {
            background: var(--bg);
            border-color: var(--accent);
            color: var(--text);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }

        .form-control::placeholder {
            color: var(--muted);
        }

        .btn-primary {
            background: var(--accent);
            border: none;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .alert {
            font-size: 0.875rem;
        }

        .form-label {
            color: var(--muted);
            font-size: 0.875rem;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-header">
            <h1>Kepler's Horizon</h1>
            <div class="subtitle">Space Fleet Tactics Game</div>
        </div>

        <ul class="nav nav-tabs nav-fill" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login"
                    type="button" role="tab">Login</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button"
                    role="tab">Register</button>
            </li>
        </ul>

        <div class="card-body p-4">
            <div id="alertBox" class="alert d-none" role="alert"></div>

            <div class="tab-content">
                <!-- Login Form -->
                <div class="tab-pane fade show active" id="login" role="tabpanel">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginUsername" class="form-label">Username</label>
                            <input type="text" class="form-control" id="loginUsername" required autocomplete="username">
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" required
                                autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                </div>

                <!-- Register Form -->
                <div class="tab-pane fade" id="register" role="tabpanel">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="regUsername" class="form-label">Username</label>
                            <input type="text" class="form-control" id="regUsername" required minlength="3"
                                maxlength="32" autocomplete="username">
                        </div>
                        <div class="mb-3">
                            <label for="regEmail" class="form-label">Email (optional)</label>
                            <input type="email" class="form-control" id="regEmail" autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="regPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="regPassword" required minlength="4"
                                autocomplete="new-password">
                        </div>
                        <div class="mb-3">
                            <label for="regConfirm" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="regConfirm" required
                                autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Create Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="portal.js"></script>
</body>

</html>
