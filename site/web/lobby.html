<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepler's Horizon - Lobby</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --panel: #0a0a12;
            --text: #3f3;
            --muted: #2a2;
            --accent: #4f4;
            --border: #1a3a1a;
            --good: #4f8;
            --bad: #f44;
            --glow: rgba(50, 255, 50, 0.8);
            --glow-soft: rgba(50, 255, 50, 0.4);
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-family: 'VT323', monospace;
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--glow), 0 0 15px var(--glow-soft);
            padding: 1.5rem;
        }

        .navbar {
            background: var(--panel);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(50, 255, 50, 0.15);
        }

        .navbar-brand {
            color: var(--text) !important;
            font-size: 1.5rem;
            text-shadow: 0 0 10px var(--glow);
        }

        .nav-text {
            color: var(--muted);
            margin-right: 1rem;
            font-size: 1.2rem;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(50, 255, 50, 0.15);
        }

        .card-header {
            background: transparent;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h5 {
            font-size: 1.4rem;
            color: var(--text);
        }

        .table {
            color: var(--text);
            margin-bottom: 0;
            font-size: 1.2rem;
        }

        .table th {
            border-color: var(--border);
            color: var(--muted);
            font-weight: 500;
            font-size: 1.1rem;
        }

        .table td {
            border-color: var(--border);
            vertical-align: middle;
        }

        .btn-primary {
            background: transparent;
            border: 1px solid var(--text);
            color: var(--text);
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            text-shadow: 0 0 5px var(--glow);
        }

        .btn-primary:hover {
            background: var(--text);
            color: var(--bg);
            box-shadow: 0 0 15px var(--glow);
        }

        .btn-outline-light {
            border-color: var(--muted);
            color: var(--text);
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
        }

        .btn-outline-light:hover {
            background: rgba(50, 255, 50, 0.2);
            border-color: var(--accent);
            color: var(--accent);
        }

        .online-badge {
            background: var(--good);
            color: var(--bg);
            font-size: 1rem;
            padding: 4px 10px;
            border-radius: 12px;
            text-shadow: none;
        }

        .form-control {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'VT323', monospace;
            font-size: 1.3rem;
            text-shadow: 0 0 5px var(--glow);
        }

        .form-control:focus {
            background: var(--bg);
            border-color: var(--accent);
            color: var(--text);
            box-shadow: 0 0 8px var(--glow-soft);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--muted);
            font-size: 1.3rem;
        }

        .room-code {
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            color: var(--accent);
            text-shadow: 0 0 8px var(--glow);
        }

        .seats-display {
            font-size: 1.1rem;
        }

        .seats-display .filled {
            color: var(--good);
        }

        .seats-display .empty {
            color: var(--muted);
        }

        #onlineCount {
            color: var(--accent);
        }

        .modal-content {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .modal-header,
        .modal-footer {
            border-color: var(--border);
        }

        .form-label {
            color: var(--muted);
            font-size: 1.2rem;
        }

        .text-danger {
            color: var(--bad) !important;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand px-3">
        <span class="navbar-brand">Kepler's Horizon</span>
        <div class="ms-auto d-flex align-items-center">
            <span class="nav-text">
                <span id="onlineCount">0</span> online
            </span>
            <span class="nav-text">
                Logged in as <strong id="username">-</strong>
            </span>
            <button class="btn btn-sm btn-outline-light" id="btnLogout">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            <!-- Room List -->
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header py-3 px-4">
                        <h5 class="mb-0">Open Rooms</h5>
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createModal">
                            + Create Room
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div id="roomList">
                            <div class="empty-state">
                                <p>No open rooms</p>
                                <p class="small" style="font-size: 1.1rem;">Create one or join by code</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Join by Code -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header py-3 px-4">
                        <h5 class="mb-0">Join by Code</h5>
                    </div>
                    <div class="card-body">
                        <div class="input-group">
                            <input type="text" class="form-control" id="joinCode" placeholder="Enter room code"
                                maxlength="6">
                            <button class="btn btn-primary" id="btnJoinCode">Join</button>
                        </div>
                        <div id="joinError" class="text-danger small mt-2 d-none" style="font-size: 1.1rem;"></div>
                    </div>
                </div>

                <div class="card mt-4">
                    <div class="card-header py-3 px-4">
                        <h5 class="mb-0">Your Room</h5>
                    </div>
                    <div class="card-body">
                        <div id="yourRoom" class="text-center" style="color: var(--muted); font-size: 1.2rem;">
                            Not in a room
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Room Modal -->
    <div class="modal fade" id="createModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create Room</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Room Name</label>
                        <input type="text" class="form-control" id="roomName" placeholder="My Game Room" maxlength="64">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="btnCreateRoom">Create</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lobby.js"></script>
</body>

</html>
